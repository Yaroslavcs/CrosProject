quarkus.oidc.auth-server-url=http://localhost:8080/realms/quarkus
quarkus.oidc.client-id=backend-service
quarkus.oidc.credentials.secret=secret
quarkus.oidc.authentication.enabled=true
quarkus.oidc.token.issuer=http://localhost:8080/realms/quarkus
quarkus.oidc.token.audience=backend-service

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=quarkus_user
quarkus.datasource.password=quarkus_password
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/quarkus_db
quarkus.hibernate-orm.database.generation=drop-and-create
